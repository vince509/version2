<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Research Assistant</title>
  <link rel="stylesheet" href="researchpart2.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="research.html">
        <img class="brand-mark" src="sti-logo.png" alt="" />
        <span><strong>Research Hub</strong><small>STI College Alaminos</small></span>
      </a>
      <nav class="side-nav">
        <a class="nav-link" href="repository.html"><span aria-hidden="true">▤</span> Repository</a>
        <a class="nav-link" href="search.html"><span aria-hidden="true">⌕</span> Smart search</a>
        <a class="nav-link active" href="assistant.html"><span aria-hidden="true">✳</span> Research assistant</a>
        <a class="nav-link" href="about.html"><span aria-hidden="true">ⓘ</span> About the project</a>
      </nav>
    </aside>
    <main class="main-area">
      <header class="topbar">
        <div class="breadcrumb">Library <span aria-hidden="true">/</span> <strong>Research assistant</strong></div>
      </header>
      <div class="page-wrap">
        <section class="section-card">
          <h1>Research assistant</h1>
          <div class="chat-messages">
            <div class="chat-bubble assistant-bubble">Ask about student learning, AI, or topics in your saved papers.</div>
          </div>
          <form class="chat-form">
            <input type="text" placeholder="Ask a research question…" aria-label="Ask a research question" />
            <button type="submit" aria-label="Send message">↑</button>
          </form>
        </section>
      </div>
    </main>
  </div>
</body>
</html>
